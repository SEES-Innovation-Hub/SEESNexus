name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sees_nexus
          POSTGRES_PASSWORD: sees_nexus
          POSTGRES_DB: sees_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sees_nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://sees_nexus:sees_nexus@localhost:5432/sees_nexus_test
        run: alembic upgrade head

      - name: Migration round-trip (Postgres)
        env:
          DATABASE_URL: postgresql+asyncpg://sees_nexus:sees_nexus@localhost:5432/sees_nexus_test
        # The suite runs on in-memory SQLite and cannot catch enum creation
        # ordering; this step does.
        run: alembic upgrade head && alembic downgrade -1 && alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://sees_nexus:sees_nexus@localhost:5432/sees_nexus_test
          SECRET_KEY: ci-test-secret
        run: pytest app/tests -v
