name: Repo guard

# Runs on every change: see .github/scripts/repo-guard.sh for what it checks
# and why.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/repo-guard.sh
